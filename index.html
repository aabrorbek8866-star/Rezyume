<!DOCTYPE html>
<html lang="uz" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrorbek Azimov — Rezyume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: shaxsiy rezyume-portfolio, ishonchli va zamonaviy, 3 tilda
   IDEA: zumrad tun / yashil tong — bitta palitraning ikki holati
   PICTURE: katta gradient ism, suzuvchi yashil nurlar, yulduzlar
   COLOUR and TYPE: #051F20 #0B2B26 #163832 #235347 #8EB69B #DAF1DE; Syne + Space Grotesk (kirill uchun zaxira shrift)
   LAYOUT: yopishqoq yuqori panel (til + rejim), bitta ustun 980px, 600px dan pastda bir ustun */
:root{--g1:#051F20;--g2:#0B2B26;--g3:#163832;--g4:#235347;--g5:#8EB69B;--g6:#DAF1DE}
html[data-mode=dark]{color-scheme:dark;--bg:#051F20;--card:rgba(11,43,38,.78);--card2:#163832;--line:#235347;--ink:#DAF1DE;--mute:#9dbca6;--soft:#c4dcc9;--acc:#8EB69B;--accbg:#8EB69B;--onacc:#051F20;--bar:#163832;--top:rgba(5,31,32,.72);--glow:rgba(142,182,155,.45);--h1:linear-gradient(100deg,#DAF1DE 0%,#8EB69B 30%,#ffffff 50%,#8EB69B 70%,#DAF1DE 100%);--orb:#8EB69B;--orb2:#235347;--orbo:.55;--star:'218,241,222'}
html[data-mode=light]{color-scheme:light;--bg:#e9f5eb;--card:rgba(255,255,255,.82);--card2:#DAF1DE;--line:#b5d4bd;--ink:#051F20;--mute:#3d6b5a;--soft:#163832;--acc:#235347;--accbg:#235347;--onacc:#DAF1DE;--bar:#cfe6d4;--top:rgba(233,245,235,.8);--glow:rgba(35,83,71,.25);--h1:linear-gradient(100deg,#051F20 0%,#235347 30%,#8EB69B 50%,#235347 70%,#051F20 100%);--orb:#8EB69B;--orb2:#DAF1DE;--orbo:.5;--star:'35,83,71'}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Space Grotesk","Segoe UI",system-ui,sans-serif;overflow-x:clip;transition:background-color .6s,color .6s}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;opacity:var(--orbo);animation:float 18s ease-in-out infinite alternate;transition:opacity .6s}
.orb.a{width:380px;height:380px;left:-140px;top:8%;background:radial-gradient(circle,var(--orb),transparent 70%)}
.orb.b{width:320px;height:320px;right:-120px;top:4%;background:radial-gradient(circle,var(--orb),transparent 70%);animation-delay:-6s}
.orb.c{width:300px;height:300px;left:-100px;bottom:-60px;background:radial-gradient(circle,var(--orb2),transparent 70%);animation-delay:-3s}
.orb.d{width:340px;height:340px;right:-120px;bottom:6%;background:radial-gradient(circle,var(--orb),transparent 70%);animation-delay:-10s}
a{color:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--top);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:background .6s}
.top .in{max-width:980px;margin:0 auto;padding:10px max(4vw,16px);display:flex;align-items:center;gap:14px}
.logo{font:800 18px/1 Syne,sans-serif;text-decoration:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accbg);color:var(--onacc);flex:none}
.top nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.top nav a{text-decoration:none;font-size:14px;font-weight:500;color:var(--mute);padding:8px 10px;border-radius:8px;white-space:nowrap}
.top nav a:hover{color:var(--ink);background:var(--card2)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);flex:none}
.seg button{min-width:40px;height:34px;border:0;border-radius:999px;background:none;color:var(--mute);font:700 13px "Space Grotesk",sans-serif;cursor:pointer;transition:all .25s}
.seg button.act{background:var(--accbg);color:var(--onacc)}
.mode{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center;overflow:hidden}
.mode svg{width:20px;height:20px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
html[data-mode=light] .mode .moon,html[data-mode=dark] .mode .sun{display:none}
.mode:hover svg{transform:rotate(40deg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:clamp(24px,5vw,52px) max(4vw,16px) 40px}
/* hero */
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);backdrop-filter:blur(8px);font-size:13px;font-weight:600;color:var(--acc)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--accbg);animation:pulse 2s ease-in-out infinite}
h1{font:800 clamp(44px,9vw,92px)/.98 Syne,"Segoe UI",sans-serif;margin:18px 0 12px;background:var(--h1);background-size:250% 100%;animation:shine 7s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.role{font-size:clamp(17px,2.4vw,20px);color:var(--mute);margin:0;min-height:1.6em}
.role em{font-style:normal;color:var(--acc);font-weight:600}.role b{color:var(--ink);font-weight:600}
.cursor{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1) infinite}
.sub{color:var(--mute);margin:6px 0 0;font-size:15px}
.rule{width:56px;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin:18px 0;animation:grow 1.2s .5s both}
.stats{display:flex;flex-wrap:wrap;row-gap:12px}
.stat{padding-right:22px;margin-right:22px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{display:block;font:800 clamp(24px,4vw,32px)/1.1 Syne,sans-serif;color:var(--acc)}
.stat span{font-size:13px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px;text-decoration:none;transition:border-color .2s,transform .2s}
a.chip:hover{border-color:var(--acc);transform:translateY(-2px)}
.chip svg{width:16px;height:16px;flex:none;color:var(--acc)}
.chip.tg{border-color:var(--acc);animation:pulse 2.6s ease-in-out infinite}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:clamp(20px,4vw,48px);align-items:center}
.hero h1{font-size:clamp(42px,7.4vw,80px)}
.htxt>*{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.htxt>*:nth-child(2){animation-delay:.1s}.htxt>*:nth-child(3){animation-delay:.2s}.htxt>*:nth-child(4){animation-delay:.3s}.htxt>*:nth-child(6){animation-delay:.4s}.htxt>*:nth-child(7){animation-delay:.5s}
.pic{position:relative;width:100%;max-width:330px;justify-self:end;animation:rise 1s .2s cubic-bezier(.2,.8,.2,1) both}
.frame{position:relative;padding:3px;border-radius:190px 190px 30px 30px;background:conic-gradient(from var(--a,0deg),var(--g6),var(--g5),#3ee6f0,var(--g4),var(--g6));animation:turn 6s linear infinite;box-shadow:0 30px 80px -25px var(--glow)}
.frame::after{content:"";position:absolute;inset:-18px;border-radius:200px 200px 40px 40px;border:1.5px dashed var(--line);z-index:-1}
.frame img{display:block;width:100%;aspect-ratio:10/13;object-fit:cover;object-position:50% 15%;border-radius:187px 187px 27px 27px;background:#000}
.frame .fade{position:absolute;left:3px;right:3px;bottom:3px;height:38%;border-radius:0 0 27px 27px;background:linear-gradient(transparent,rgba(5,31,32,.85))}
.ptag{position:absolute;left:-18px;bottom:34px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--top);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:bob 5s ease-in-out infinite}
.ptag img{width:38px;height:38px;border-radius:50%}
.ptag b{display:block;font-size:13px;line-height:1.2}.ptag span{font-size:12px;color:var(--mute)}
.pbadge{position:absolute;right:-10px;top:42px;display:grid;place-items:center;width:74px;height:74px;border-radius:50%;background:var(--accbg);color:var(--onacc);text-align:center;font:800 20px/1 Syne,sans-serif;box-shadow:0 10px 30px -8px var(--glow);animation:bob 5s 1.2s ease-in-out infinite}
.pbadge small{display:block;font:600 10px/1.1 "Space Grotesk",sans-serif;margin-top:3px}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes turn{to{--a:360deg}}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}.pic{order:-1;justify-self:center;max-width:250px;margin:6px 0 10px}.ptag{left:-10px}.pbadge{right:-6px;width:64px;height:64px;font-size:17px}}
/* sections */
h2{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:700;color:var(--acc);margin:52px 0 16px;letter-spacing:.02em}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:transform .3s,border-color .3s,box-shadow .3s,background .6s}
.card:hover{border-color:var(--acc);box-shadow:0 18px 50px -20px var(--glow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hl{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,var(--glow),transparent 55%),var(--card)}
.now{font-size:12px;font-weight:700;color:var(--acc);display:inline-flex;align-items:center;gap:6px}
.now i{width:7px;height:7px;border-radius:50%;background:var(--accbg);animation:pulse 2s infinite}
.hl h3{font:700 clamp(20px,3vw,24px)/1.2 Syne,"Segoe UI",sans-serif;margin:8px 0 6px}
.org{color:var(--mute);font-size:14px;margin:0 0 12px}
.hl ul,.ev ul{margin:0;padding-left:18px;color:var(--soft);font-size:15px}
.hl li+li,.ev li+li{margin-top:5px}
.edu{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:center}
.edu h3{margin:0 0 4px;font-size:22px;font-weight:600}
.date{font-size:13px;color:var(--acc);font-weight:600}
.edu p{color:var(--mute);margin:8px 0 12px}
.edu ul{margin:0;padding-left:18px;color:var(--mute);font-size:15px}
.gpa{text-align:center;border-left:1px solid var(--line);padding:10px}
.gpa b{font:800 clamp(44px,7vw,64px)/1 Syne,sans-serif;color:var(--acc)}
.gpa span{display:block;font-size:13px;color:var(--mute);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:var(--card2);transition:transform .2s,background .2s}
.tag:hover{transform:translateY(-2px)}
.tag.t1{color:var(--acc);border-color:var(--acc);background:transparent}
.tag.t2{color:var(--onacc);background:var(--accbg);border-color:var(--accbg)}
.sk h4{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--acc)}
.bar{margin-bottom:14px}
.bar div{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.bar div span{color:var(--acc);font-weight:500;font-size:13px}
.bar p{margin:6px 0 0;height:5px;border-radius:5px;background:var(--bar);overflow:hidden}
.bar p i{display:block;height:100%;border-radius:5px;width:0;background:linear-gradient(90deg,var(--g4),var(--g5));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
html[data-mode=dark] .bar p i{background:linear-gradient(90deg,var(--g4),var(--g5),var(--g6))}
.grp{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--acc);margin:20px 0 12px}
.grp:first-child{margin-top:0}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.box{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;transition:transform .3s,border-color .3s}
.box:hover{transform:translateY(-3px);border-color:var(--acc)}
.ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--acc);background:var(--card)}
.ico svg{width:18px;height:18px}
.box b{display:block;font-size:15px}
.box span{font-size:13px;color:var(--mute);line-height:1.45}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--acc),var(--g5),var(--line));transform-origin:top;transform:scaleY(0);transition:transform 1.6s ease}
.on .tl::before{transform:scaleY(1)}
.ev{position:relative;padding-bottom:22px}.ev:last-child{padding-bottom:0}
.ev::before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}
.ev:first-child::before{background:var(--accbg);animation:pulse 2s infinite}
.ev small{font-size:12px;font-weight:700;color:var(--acc)}
.ev h4{margin:2px 0 4px;font-size:18px}
.ev .o{font-size:14px;color:var(--mute);margin:0 0 6px}
/* portfolio */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.fb{min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 14px "Space Grotesk",sans-serif;cursor:pointer;transition:all .25s}
.fb:hover{color:var(--ink);border-color:var(--acc)}
.fb.act{background:var(--accbg);color:var(--onacc);border-color:var(--accbg)}
.pf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pc{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .35s,border-color .3s,box-shadow .3s}
.pc:hover{transform:translateY(-5px);border-color:var(--acc);box-shadow:0 22px 50px -22px var(--glow)}
.pc.hide{display:none}.pc.pop{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.th{position:relative;height:130px;overflow:hidden;background:linear-gradient(135deg,var(--g3),var(--g2))}
html[data-mode=light] .th{background:linear-gradient(135deg,#DAF1DE,#8EB69B)}
.th::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,70%) 30%,rgba(142,182,155,.5),transparent 55%);transition:transform .6s}
html[data-mode=light] .th::before{background:radial-gradient(circle at var(--x,70%) 30%,rgba(255,255,255,.75),transparent 55%)}
.pc:hover .th::before{transform:scale(1.25)}
.th svg.grid{position:absolute;inset:0;width:100%;height:100%;opacity:.18;color:var(--ink)}
.big{position:absolute;left:18px;bottom:16px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--acc);transition:transform .4s}
.pc:hover .big{transform:rotate(-8deg) scale(1.08)}
.big svg{width:26px;height:26px}
.cat{position:absolute;right:14px;top:14px;font-size:12px;font-weight:600;color:var(--onacc);background:var(--accbg);padding:3px 10px;border-radius:999px}
.pb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.pb h3{margin:0;font-size:17px;line-height:1.3}
.pb p{margin:0;font-size:14px;color:var(--mute);flex:1}
.pb .tag{font-size:12px;padding:3px 10px}
.pi{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;margin:0}
.dl dt{color:var(--mute);font-size:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.dl dd{margin:0;padding:11px 0;border-bottom:1px solid var(--line);font-weight:600}
.dl dt:last-of-type,.dl dd:last-of-type{border:0}
.cert{display:flex;gap:14px;align-items:center;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.cert .ico{width:46px;height:46px;border-radius:12px;background:var(--accbg);color:var(--onacc);border:0}
.cert .ico svg{width:22px;height:22px}
.cert b{display:block}.cert span{font-size:13px;color:var(--mute)}
.cert .dt{margin-left:auto;font-size:13px;font-weight:700;color:var(--acc);white-space:nowrap}
.doc{display:flex;flex-direction:column;gap:10px}
.doc button.shot{padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;background:#fff;display:block;width:100%;position:relative}
.doc button.shot img{display:block;width:100%;height:auto;transition:transform .5s}
.doc button.shot:hover img{transform:scale(1.04)}
.doc button.shot span{position:absolute;right:10px;bottom:10px;font:600 12px "Space Grotesk",sans-serif;background:var(--g1);color:var(--g6);padding:4px 10px;border-radius:999px}
.doc h4{margin:0;font-size:16px}
.doc p{margin:0;font-size:13px;color:var(--mute)}
.doc a.v{color:var(--acc);font-weight:600;font-size:14px}
.rec{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.rec th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.rec td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rec tr:last-child td{border:0}
.rec td:first-child{white-space:nowrap;color:var(--acc);font-weight:600}
.lb{position:fixed;inset:0;z-index:20;background:rgba(5,31,32,.88);backdrop-filter:blur(6px);display:none;place-items:center;padding:20px;cursor:zoom-out}
.lb.open{display:grid;animation:fadein .3s both}
.lb img{max-width:min(1000px,100%);max-height:90vh;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
@media(max-width:720px){.pi{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.rec thead{display:none}.rec tr{display:grid;padding:8px 0;border-bottom:1px solid var(--line)}.rec td{border:0;padding:2px 0}.dl{grid-template-columns:minmax(0,1fr)}.dl dt{border:0;padding-bottom:0}.cert{flex-wrap:wrap}.cert .dt{margin-left:0}}
.dream{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:clamp(20px,4vw,44px);align-items:center;padding:clamp(22px,4vw,36px);background:radial-gradient(90% 120% at 15% 40%,var(--glow),transparent 60%),var(--card)}
.ring{position:relative;width:min(280px,70vw);aspect-ratio:1;margin:auto;display:grid;place-items:center}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--g6),var(--g5),#3ee6f0,var(--g4),transparent 70%,var(--g6));animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);filter:drop-shadow(0 0 14px rgba(62,230,240,.55))}
.ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px dashed var(--g5);opacity:.55;animation:spin 30s linear infinite reverse}
.ring img{position:relative;width:84%;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 20px 60px -10px rgba(5,31,32,.8),0 0 0 4px var(--bg);animation:bob 5s ease-in-out infinite}
.orbit{position:absolute;inset:-14px;animation:spin 12s linear infinite}
.orbit i{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#3ee6f0;box-shadow:0 0 14px #3ee6f0}
.orbit.o2{animation-duration:18s;animation-direction:reverse}.orbit.o2 i{background:var(--g6);box-shadow:0 0 12px var(--g6);top:auto;bottom:-5px}
.dream .now{margin-bottom:6px}
.dream h3{font:700 clamp(24px,3.6vw,32px)/1.15 Syne,"Segoe UI",sans-serif;margin:4px 0 10px;text-wrap:balance}
.dream p.lead{color:var(--mute);margin:0 0 12px;max-width:60ch}
.brand{display:inline-block;font:800 clamp(26px,4.4vw,40px)/1.05 Syne,sans-serif;margin:0 0 4px;background:linear-gradient(90deg,var(--ink),#3ee6f0,var(--ink));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
html[data-mode=light] .brand{background-image:linear-gradient(90deg,#051F20,#0aa5b5,#051F20)}
.place{font-size:14px;color:var(--acc);font-weight:600;margin:0 0 16px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feat .box{padding:12px 14px}
.meter{margin-top:16px}
.meter div{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--acc)}
.meter p{margin:6px 0 0;height:6px;border-radius:6px;background:var(--bar);overflow:hidden}
.meter p i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--g4),var(--g5),#3ee6f0);transition:width 2s cubic-bezier(.2,.8,.2,1)}
.logo.img{background:none;padding:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--acc)}

@keyframes bob{50%{transform:translateY(-6px)}}

.goal h3 span{color:var(--acc)}
.goal p{color:var(--mute);margin:0 0 18px;max-width:64ch}
.goal p b{color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);background:var(--card2);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px var(--glow)}
.btn.p{background:linear-gradient(90deg,var(--g4),var(--g5),var(--g4));background-size:200% 100%;color:#fff;border:0;animation:shine 4s linear infinite}

.btn svg{width:16px;height:16px}
.lang{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.lang:last-child{border:0}
.lang span{font-size:12px;font-weight:600;color:var(--acc);border:1px solid var(--line);padding:3px 10px;border-radius:999px;white-space:nowrap}
.soft{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.soft div{font-size:14px;color:var(--soft);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:all .25s}
.soft div:hover{background:var(--accbg);color:var(--onacc)}
footer{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:var(--mute)}
footer b{display:block;color:var(--ink);font-size:15px;font-weight:600}

footer nav a{text-decoration:none}footer nav a:hover{color:var(--acc)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}

#app.swap{animation:fadein .45s ease both}

    <p>${t.pi.doc[3]}</p>
  </div>
</div>
<h2 class="rv" id="skills">${t.h.sk}</h2>
<div class="grid2 rv">${skills}</div>
<div class="card rv" style="margin-top:14px"><div class="grp">${t.h.all}</div><div class="tags">${tech}</div></div>
<h2 class="rv">${t.h.ex}</h2>
<div class="card rv">${extra}</div>
<h2 class="rv" id="experience">${t.h.exp}</h2>
<div class="card rv"><div class="tl">${tl}</div></div>
<h2 class="rv" id="portfolio">${t.h.pf}</h2>
<div class="rv"><div class="filters" id="filters">${fl}</div><div class="pf" id="pf">${cards}</div></div>
<h2 class="rv" id="dream">${t.dr.h}</h2>
<div class="card dream rv">
  <div class="ring"><div class="orbit"><i></i></div><div class="orbit o2"><i></i></div><img src="logo.png" alt="AI-Tech Azimov"></div>
  <div>
    <span class="now"><i></i>${t.dr.tag}</span>
    <h3>${t.dr.t}</h3>
    <p class="lead">${t.dr.lead}</p>
    <div class="brand">AI-Tech Azimov</div>
    <p class="place">${t.dr.place}</p>
    <div class="feat">${t.dr.f.map((x,k)=>`<div class="box"><span class="ico">${sv(['cap','users','mic','chart'][k])}</span><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div>
    <div class="meter"><div>${t.dr.m}<span>100%</span></div><p><i data-w="100"></i></p></div>
  </div>
</div>
<h2 class="rv" id="contact">${t.h.goal}</h2>
<div class="card goal rv"><h3>${t.goal[0]}</h3><p>${t.goal[1]}</p><div class="btns"><a class="btn p" href="${TG}">${sv('tg')}${t.goal[2]}</a><a class="btn" href="mailto:${EM}">${sv('em')}${t.goal[3]}</a></div></div>
<h2 class="rv">${t.h.more}</h2>
<div class="grid2 rv">
  <div class="card"><div class="grp">${t.h.langs}</div>${t.lg.map(l=>`<div class="lang">${l[0]} <span>${l[1]}</span></div>`).join('')}</div>
  <div class="card"><div class="grp">${t.h.soft}</div><div class="soft">${t.soft.map(s=>`<div>${s}</div>`).join('')}</div></div>
</div>
<footer><div><b>${t.full}</b>${t.badge}</div><nav><a href="#portfolio">${t.nav[2]}</a><a href="${TG}">Telegram</a><a href="mailto:${EM}">Email</a><a href="tel:+998775338866">${PH}</a></nav><div>${t.copy}</div></footer>`;
 document.getElementById('nav').innerHTML=[["#skills",t.nav[0]],["#experience",t.nav[1]],["#portfolio",t.nav[2]],["#contact",t.nav[3]]].map(n=>`<a href="${n[0]}">${n[1]}</a>`).join('');
 root.lang=lang;document.title=t.title;
 document.getElementById('mode').setAttribute('aria-label',t.mode);
 document.querySelectorAll('#langs button').forEach(b=>{const on=b.dataset.l===lang;b.classList.toggle('act',on);b.setAttribute('aria-pressed',on)});
 observe();startTyper();
};

/* reveal */
let io;
const reveal=el=>{el.classList.add('on');el.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%')};
const observe=()=>{
 if(io)io.disconnect();
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){reveal(e.target);io.unobserve(e.target)}}),{threshold:.1});
 document.querySelectorAll('.rv').forEach(el=>io.observe(el));
 setTimeout(()=>document.querySelectorAll('.rv:not(.on)').forEach(el=>{const r=el.getBoundingClientRect();if(r.top<innerHeight)reveal(el)}),300);
 setTimeout(()=>document.querySelectorAll('.rv:not(.on)').forEach(reveal),3000);
};

/* typer */
let tt;
const startTyper=()=>{
 clearTimeout(tt);if(still)return;
 const words=L[lang].typer,ty=document.getElementById('typer');let w=0,c=words[0].length,del=true;
 const tick=()=>{if(!ty.isConnected)return;if(del){c--;if(c<=0){del=false;w=(w+1)%words.length}}else{c++;if(c>=words[w].length){del=true;ty.textContent=words[w];tt=setTimeout(tick,2200);return}}ty.textContent=words[w].slice(0,Math.max(c,0));tt=setTimeout(tick,del?35:70)};
 tt=setTimeout(tick,2600);
};

/* events */
document.getElementById('langs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.l===lang)return;lang=b.dataset.l;store.set('cv-lang',lang);app.classList.remove('swap');void app.offsetWidth;app.classList.add('swap');render()});
document.getElementById('mode').addEventListener('click',()=>{mode=mode==='dark'?'light':'dark';root.dataset.mode=mode;store.set('cv-mode',mode)});
app.addEventListener('click',e=>{const b=e.target.closest('.fb');if(!b)return;
 document.querySelectorAll('.fb').forEach(x=>{x.classList.toggle('act',x===b);x.setAttribute('aria-pressed',x===b)});
 let n=0;document.querySelectorAll('.pc').forEach(c=>{const ok=b.dataset.f==='all'||c.dataset.c===b.dataset.f;c.classList.toggle('hide',!ok);c.classList.remove('pop');if(ok){void c.offsetWidth;c.style.animationDelay=(n++*60)+'ms';c.classList.add('pop')}})});

const lb=document.getElementById('lb');
app.addEventListener('click',e=>{if(e.target.closest('#shot'))lb.classList.add('open')});
lb.addEventListener('click',()=>lb.classList.remove('open'));
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
/* stars */
const cv=document.getElementById('sky'),x=cv.getContext('2d');let stars=[];
const rs=()=>{const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;stars=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:(Math.random()*1.2+.3)*d,p:Math.random()*6.28}))};
const dr=t=>{const c=getComputedStyle(root).getPropertyValue('--star').replace(/'/g,'').trim()||'218,241,222';x.clearRect(0,0,cv.width,cv.height);for(const s of stars){x.fillStyle=`rgba(${c},${.2+.35*Math.sin(t/1400+s.p)**2})`;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}if(!still)requestAnimationFrame(dr)};
addEventListener('resize',rs);rs();requestAnimationFrame(dr);

render();
}
</script>
</body>
</html>
